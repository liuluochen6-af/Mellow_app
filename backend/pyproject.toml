[project]
name = "foodcheckin-backend"
version = "0.1.0"
description = "FoodCheckIn API backend"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "pydantic-settings==2.3.1",
    "python-jose==3.3.0",
    "httpx==0.27.0",
    "Pillow==10.3.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
]
